              {
                "@type": "Question",
                "name": "Hva leverer Tvela AS?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Tvela AS er et IT-selskap med fire divisjoner: Utvikling (system, web, apper, innhold og innholdshåndtering), Nettverk (bedriftsnett, Wi-Fi og infrastruktur), Sikkerhet (IT-sikkerhet, testing og gransking) og Konsulent (rådgivning og prosjektbistand). Kontor i Fagernes, kunder i hele Norge."
                }
              },
              {
                "@type": "Question",
                "name": "Hva er systemutvikling?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Systemutvikling er å designe og bygge programvare som støtter arbeidsflyt og forretning – for eksempel kundeportaler, interne verktøy, integrasjoner og databaser. Tvela AS leverer systemutvikling til bedrifter i hele Norge."
                }
              },
              {
                "@type": "Question",
                "name": "Hva er webutvikling?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Webutvikling er å lage nettsider og webapplikasjoner som fungerer i nettleseren. Vi bygger moderne, raske og søkemotorvennlige løsninger – fra bedriftsnettside til mer avanserte webapper."
                }
              },
              {
                "@type": "Question",
                "name": "Leverer dere også innhold og innholdshåndtering?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Ja. Under Tvela Utvikling leverer vi innholdsproduksjon (foto, video og design) og innholdshåndtering (annonsering og løpende oppfølging), slik at nettsider og systemer henger sammen med innholdet som publiseres."
                }
              },
              {
                "@type": "Question",
                "name": "Leverer dere webutvikling og systemutvikling i hele Norge?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Ja. Vi har kontor i Fagernes i Valdres, og jobber med kunder over hele landet. Utvikling, møter og oppfølging kan gjøres digitalt, slik at geografisk avstand ikke er et hinder."
                }
              },
              {
                "@type": "Question",
                "name": "Hva koster webutvikling eller et system?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Prisen avhenger av omfang, integrasjoner og om det er en nettside, en app eller et skreddersydd system. Vi gir et konkret tilbud etter en kort avklaring."
                }
              },
              {
                "@type": "Question",
                "name": "Lager dere også apper og fullstack-løsninger?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Ja. Vi leverer fullstack utvikling: webutvikling, systemutvikling, mobilapplikasjoner, sky og database – og kan ta ansvar for både frontend, backend og innhold."
                }
              }
